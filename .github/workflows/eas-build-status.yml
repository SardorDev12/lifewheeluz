name: EAS Build Status

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: EAS build ID to inspect
        required: true
        type: string

jobs:
  status:
    name: View EAS build status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: View build
        working-directory: mobile
        run: eas build:view ${{ inputs.build_id }}
